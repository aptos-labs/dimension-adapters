name: Setup Node.js with pnpm
description: >
  Install pnpm, set up Node.js with cache, run Aikido safe-chain check,
  and install dependencies. Requires actions/checkout to have already run
  in the calling job.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      name: Install pnpm
      with:
        version: 10
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20
        cache: 'pnpm'

    - uses: aptos-labs/actions/aikidosec-safe-chain@main

    - name: Install dependencies
      shell: bash
      run: pnpm install
